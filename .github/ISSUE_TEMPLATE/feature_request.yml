name: Feature request
description: Ask for a new command, option or behaviour.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dataverse (dv)
        - Azure DevOps (ado)
        - Microsoft Graph (graph)
        - Sign-in, identities, groups and environments
        - Agent skills
        - Output and errors
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like ppdo-cli to do?
      description: The command or option you have in mind, with an example if you can.
      render: shell
      placeholder: ppdo-cli dv ...

  - type: textarea
    id: workaround
    attributes:
      label: How do you do it now?
      description: For example with `ppdo-cli dv api` or `ppdo-cli ado api`, pac, or the portal.
