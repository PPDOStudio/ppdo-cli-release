<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="title desc">
  <title id="title">How ppdo-cli's config works</title>
  <desc id="desc">A group holds an identity and a mode, and the environments in it. Modes are read-only, read-write and full. Every command picks an environment, signs in, checks the mode, then sends. Widening a mode needs a person, a URL belongs to one environment, and the config is checked on every read.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11203a"/>
      <stop offset="0.55" stop-color="#0e1729"/>
      <stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.18" r="0.45">
      <stop offset="0" stop-color="#1e5aa8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1e5aa8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#2a3954" opacity="0.7"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="0.6" stop-color="#3aa0e8"/>
      <stop offset="1" stop-color="#2ecc71"/>
    </linearGradient>
    <clipPath id="panel"><rect x="0" y="0" width="1200" height="690" rx="24"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4d70"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .eyebrow { fill: #8b9bb4; font-size: 13px; font-weight: 600; letter-spacing: 4px; }
      .title { fill: #e2e8f0; font-size: 40px; font-weight: 700; }
      .lead { fill: #8b9bb4; font-size: 17px; }
      .label { fill: #cbd5e1; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; }
      .big { fill: #e2e8f0; font-size: 21px; font-weight: 600; }
      .muted { fill: #8b9bb4; font-size: 15px; }
      .small { fill: #8b9bb4; font-size: 14px; }
      .card { fill: #121d33; fill-opacity: 0.85; stroke: #22314f; }
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="690" fill="url(#bg)"/>
    <rect width="1200" height="690" fill="url(#glow)"/>
    <rect width="1200" height="690" fill="url(#dots)"/>
    <rect y="684" width="1200" height="6" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="689" rx="24" fill="none" stroke="#1e2a44"/>

  <!-- heading -->
  <text class="eyebrow" x="64" y="70">PPDO-CLI CONFIG</text>
  <text class="title" x="64" y="118">How the config works</text>
  <text class="lead" x="64" y="152">Every command runs in one environment, as its group's identity, within its group's mode.</text>

  <!-- building blocks -->
  <rect class="card" x="64" y="200" width="316" height="124" rx="16"/>
  <circle cx="94" cy="236" r="7" fill="#4fc3f7"/>
  <text class="label" x="112" y="241">IDENTITY</text>
  <text class="big" x="86" y="280">Who signs in</text>
  <text class="muted" x="86" y="306">account, tenant, sign-in method</text>

  <rect class="card" x="442" y="200" width="316" height="124" rx="16"/>
  <circle cx="472" cy="236" r="7" fill="#2f8cff"/>
  <text class="label" x="490" y="241">GROUP</text>
  <text class="big" x="464" y="280">An identity + a mode</text>
  <text class="muted" x="464" y="306">one account, one level of access</text>

  <rect class="card" x="820" y="200" width="316" height="124" rx="16"/>
  <circle cx="850" cy="236" r="7" fill="#2ecc71"/>
  <text class="label" x="868" y="241">ENVIRONMENT</text>
  <text class="big" x="842" y="280">Where it runs</text>
  <text class="muted" x="842" y="306">a Dataverse URL or DevOps project</text>

  <line x1="440" y1="262" x2="384" y2="262" stroke="#3b4d70" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="411" y="253" text-anchor="middle" font-size="12">uses</text>
  <line x1="760" y1="262" x2="816" y2="262" stroke="#3b4d70" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="789" y="253" text-anchor="middle" font-size="12">holds</text>

  <!-- modes -->
  <text class="eyebrow" x="64" y="380">MODES</text>
  <rect class="card" x="64" y="398" width="316" height="52" rx="26"/>
  <circle cx="94" cy="424" r="7" fill="#2ecc71"/>
  <text class="label" x="112" y="429">READ-ONLY</text>
  <text class="muted" x="362" y="429" text-anchor="end">reads only</text>

  <rect class="card" x="442" y="398" width="316" height="52" rx="26"/>
  <circle cx="472" cy="424" r="7" fill="#f5b041"/>
  <text class="label" x="490" y="429">READ-WRITE</text>
  <text class="muted" x="740" y="429" text-anchor="end">no deletes</text>

  <rect class="card" x="820" y="398" width="316" height="52" rx="26"/>
  <circle cx="850" cy="424" r="7" fill="#f87171"/>
  <text class="label" x="868" y="429">FULL</text>
  <text class="muted" x="1118" y="429" text-anchor="end">everything</text>

  <!-- every command -->
  <text class="eyebrow" x="64" y="506">EVERY COMMAND</text>
  <line x1="180" y1="546" x2="1020" y2="546" stroke="#22314f" stroke-width="3"/>
  <circle cx="180" cy="546" r="10" fill="#4fc3f7"/>
  <circle cx="460" cy="546" r="10" fill="#2f8cff"/>
  <circle cx="740" cy="546" r="10" fill="#f5b041"/>
  <circle cx="1020" cy="546" r="17" fill="none" stroke="#2ecc71" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="1020" cy="546" r="10" fill="#2ecc71"/>

  <text class="label" x="180" y="586" text-anchor="middle">ENVIRONMENT</text>
  <text class="small" x="180" y="610" text-anchor="middle">--env, repo pin or default</text>
  <text class="label" x="460" y="586" text-anchor="middle">SIGN IN</text>
  <text class="small" x="460" y="610" text-anchor="middle">cached token, never prompts</text>
  <text class="label" x="740" y="586" text-anchor="middle">MODE CHECK</text>
  <text class="small" x="740" y="610" text-anchor="middle">blocked: exit 7, nothing sent</text>
  <text class="label" x="1020" y="586" text-anchor="middle">SEND</text>
  <text class="small" x="1020" y="610" text-anchor="middle">only to that environment</text>

  <!-- guard rails -->
  <line x1="64" y1="638" x2="1136" y2="638" stroke="#1e2a44"/>
  <circle cx="70" cy="660" r="4" fill="#2ecc71"/>
  <text class="small" x="84" y="665">Widening a mode needs a person at a terminal</text>
  <circle cx="460" cy="660" r="4" fill="#2ecc71"/>
  <text class="small" x="474" y="665">One URL belongs to one environment</text>
  <circle cx="790" cy="660" r="4" fill="#2ecc71"/>
  <text class="small" x="804" y="665">config.json is checked on every read</text>
</svg>
