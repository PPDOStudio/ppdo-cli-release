<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ppdo-cli: one CLI for Dataverse and Azure DevOps, for agents and people">
  <title>ppdo-cli</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A2E"/>
      <stop offset="0.55" stop-color="#0F1729"/>
      <stop offset="1" stop-color="#0C1322"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F8FFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#1F8FFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1F8FFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="markFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F8FFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1F8FFF" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="markStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4EBFF4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1F8FFF" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F8FFF"/>
      <stop offset="0.45" stop-color="#4EBFF4"/>
      <stop offset="0.8" stop-color="#33C173"/>
      <stop offset="1" stop-color="#33C173" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.35" stop-color="#666666"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2A3D63"/>
    </pattern>

    <mask id="dotMask">
      <rect width="1200" height="300" fill="url(#fadeRight)"/>
    </mask>

    <clipPath id="frame">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)" mask="url(#dotMask)" opacity="0.55"/>
    <ellipse cx="150" cy="150" rx="480" ry="300" fill="url(#glow)"/>

    <!-- brand mark: a prompt in the Studio's tile -->
    <g>
      <rect x="80" y="102" width="96" height="96" rx="26" fill="url(#markFill)"/>
      <rect x="80.75" y="102.75" width="94.5" height="94.5" rx="25.25" fill="none" stroke="url(#markStroke)" stroke-width="1.5"/>
      <path d="M104 132 L124 150 L104 168" fill="none" stroke="#4EBFF4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="132" y1="168" x2="154" y2="168" stroke="#4EBFF4" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- wordmark -->
    <g font-family="Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">
      <text x="212" y="116" font-size="18" font-weight="600" letter-spacing="5.4" fill="#7588A3">POWER PLATFORM DEVOPS STUDIO</text>
      <text x="208" y="181" font-family="Cascadia Code, Cascadia Mono, SF Mono, Consolas, Menlo, monospace" font-size="60" font-weight="700" letter-spacing="-1" fill="#E1E7EF">ppdo-cli</text>
      <text x="212" y="217" font-size="18" font-weight="400" letter-spacing="0.2" fill="#7588A3">One CLI for Dataverse and Azure DevOps, for agents and people</text>
    </g>

    <!-- terminal motif: one command, three environments, three modes -->
    <g transform="translate(846 80)">
      <rect width="274" height="140" rx="12" fill="#0B1220" fill-opacity="0.85" stroke="#1B294B" stroke-width="1.5"/>
      <g fill="#2A3D63">
        <circle cx="20" cy="19" r="4"/>
        <circle cx="34" cy="19" r="4"/>
        <circle cx="48" cy="19" r="4"/>
      </g>
      <line x1="0" y1="36" x2="274" y2="36" stroke="#1B294B" stroke-width="1"/>
      <g font-family="Cascadia Code, Cascadia Mono, SF Mono, Consolas, Menlo, monospace" font-size="13">
        <text x="18" y="62"><tspan fill="#33C173">$</tspan><tspan fill="#E1E7EF"> ppdo-cli env list</tspan></text>
        <circle cx="24" cy="84" r="4.5" fill="#F87171"/>
        <text x="38" y="88.5" fill="#C3CEDD">dev</text>
        <text x="150" y="88.5" fill="#7588A3">full</text>
        <circle cx="24" cy="106" r="4.5" fill="#F8AE30"/>
        <text x="38" y="110.5" fill="#C3CEDD">uat</text>
        <text x="150" y="110.5" fill="#7588A3">read-write</text>
        <circle cx="24" cy="128" r="4.5" fill="#33C173"/>
        <text x="38" y="132.5" fill="#C3CEDD">prod</text>
        <text x="150" y="132.5" fill="#7588A3">read-only</text>
      </g>
    </g>

    <rect x="0" y="296" width="1200" height="4" fill="url(#rule)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="19.25" fill="none" stroke="#1B294B" stroke-width="1.5"/>
  </g>
</svg>
